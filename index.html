<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>Mikebrawl</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }
    #rotate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #111;
      color: #fff;
      font: bold 20px monospace;
      text-align: center;
    }
    #rotate span { font-size: 48px; }
    @media (orientation: portrait) and (pointer: coarse) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="rotate"><span>&#x21bb;</span>Rotate your phone<br>to play Mikebrawl</div>
  <script type="module" src="src/main.js"></script>
  <script>
    // Skipped on localhost so dev edits are never served stale; add ?sw to test offline locally.
    const isDev = ["localhost", "127.0.0.1"].includes(location.hostname) && !location.search.includes("sw");
    if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !isDev) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then((registration) => {
          const urls = [location.href, ...performance.getEntriesByType("resource").map((entry) => entry.name)];
          registration.active?.postMessage({ type: "cache", urls });
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
